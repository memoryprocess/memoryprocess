name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Cache bun's GLOBAL install cache (like ~/.npm) — a warm cache makes
      # `bun install` ~2s instead of ~80s. Keyed on the lockfile.
      - name: cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-buncache-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-buncache-
      - run: bun install --frozen-lockfile
      - name: bun fmt (check)
        run: bun fmt --check
      - name: typecheck (all packages)
        run: bun run check
      - name: build native + core
        run: bun run build
      - name: build test victims
        run: bun run build:victim && bun run build:testdll
      - name: test
        run: bun run test

  # Per-Node-version native compat — the .node is ABI-tied to the Node that
  # built it, so each leg rebuilds the native binary via node-gyp against its
  # own headers, then smokes the real API surface.
  compat:
    name: compat (${{ matrix.node }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '25', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-buncache-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-buncache-
      - run: bun install --frozen-lockfile
      - name: rebuild .node for node ${{ matrix.node }}
        working-directory: packages/bindings
        run: node scripts/build-native.mjs
      - name: compat smoke (node ${{ matrix.node }})
        working-directory: packages/bindings
        run: node --test tests/compat.smoke.mjs

  packaged:
    name: packaged
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-buncache-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-buncache-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: npm pack bindings (dry check)
        working-directory: packages/bindings
        run: npm pack --dry-run
      - name: npm pack core (dry check)
        working-directory: packages/core
        run: npm pack --dry-run
