name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC for npm Trusted Publishing (publish job)

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publishes to npm after release-please cuts the release -- same workflow,
  # no cross-workflow event needed (GITHUB_TOKEN-created tags/releases do
  # not fire other workflows). For each matrix package, the job resolves
  # the newest git tag matching `<pkg>@*` pushed at the release commit and
  # derives the npm dist-tag from the version suffix:
  # -dev/-next/-beta/-alpha -> that channel; stable -> `latest`.
  # `latest` only ever fires on a maintainer-authored `release-as` stable
  # version -- see docs/releasing.md.
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases == 'true'
    name: publish ${{ matrix.package }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: bindings }
          - { package: core }
          - { package: cli }
          - { package: mcp }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # need tags to resolve the release tag per package
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install
      - name: resolve release tag for this package
        id: tag
        shell: pwsh
        run: |
          $pkg = '${{ matrix.package }}'
          $tag = git tag --list "$pkg@*" --sort=-version:refname | Select-Object -First 1
          if (-not $tag) { throw "no $pkg@* tag found" }
          echo "resolved release tag $tag for $pkg"
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: build
        working-directory: packages/${{ matrix.package }}
        run: bun run build
      # The version in the tag decides the npm channel: 1.2.3-dev.4 -> dev,
      # 1.2.3-next.1 -> next, 1.2.3 (no prerelease) -> latest.
      - name: pick dist-tag from version
        id: chan
        shell: pwsh
        run: |
          $ver = '${{ steps.tag.outputs.tag }}' -replace '^[^@]+@', ''
          $channel = 'latest'
          if ($ver -match '-(dev|next|beta|alpha)') { $channel = $Matches[1] }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          echo "version=$ver channel=$channel"
      # OIDC Trusted Publishing: no NODE_AUTH_TOKEN -- the job's `id-token: write`
      # permission lets npm exchange the GitHub OIDC token for a short-lived
      # publish credential. Requires a Trusted Publisher configured on
      # npmjs.com per package pointing at THIS workflow (release-please.yml).
      - name: publish to npm (OIDC)
        working-directory: packages/${{ matrix.package }}
        run: npm publish --access public --tag ${{ steps.chan.outputs.channel }} --provenance
