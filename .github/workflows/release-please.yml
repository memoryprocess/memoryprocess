name: Release Please

on:
  push:
    branches: [main]
    tags: ['*@*'] # a pkg@ver tag (from a re-run or manual tag) also publishes
  workflow_dispatch: # manual recovery -- publish whatever tags exist

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC for npm Trusted Publishing (publish job)

jobs:
  release-please:
    # Only the release-please step runs on main pushes; tag pushes skip it
    # (a tag push means "publish this release", release-please already ran).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publishes to npm after release-please cuts the release -- same workflow,
  # no cross-workflow event (GITHUB_TOKEN-created tags/releases never fire
  # other workflows). Versions are LOCKSTEP: the four packages ship one
  # version together, so the publish runs as ONE sequential job in
  # dependency order (bindings -> core -> cli + mcp). A failure aborts
  # before downstream packages publish -- core is never live without its
  # bindings, cli/mcp never without their core.
  # The dist-tag comes from the version suffix in the resolved release tag:
  # -dev/-next/-beta/-alpha -> that channel; stable -> `latest`. `latest`
  # only ever fires on a maintainer-authored `release-as` stable version --
  # docs/releasing.md.
  publish:
    needs: release-please
    # Publish when (a) release-please just created a release on a main push,
    # or (b) a pkg@ver tag was pushed directly (re-run/manual path that
    # skipped the release-please job but still needs publishing).
    if: >-
      needs.release-please.outputs.releases == 'true' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    name: publish
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PKGS: bindings core cli mcp # publish order = dependency order
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # resolve release tags
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install
      - name: build all packages
        shell: pwsh
        run: |
          foreach ($pkg in $env:PKGS.Split(' ')) {
            Push-Location "packages/$pkg"
            bun run build
            if ($LASTEXITCODE -ne 0) { throw "build failed for $pkg" }
            Pop-Location
          }
      # bindings also ships per-Node-ABI prebuilds (prebuildify). Run it here
      # in the publish step -- `bun publish` does not pick up node-gyp from the
      # PATH the way npm does, so a `prepublishOnly` script would fail with
      # 'node-gyp.cmd is not recognized'. Building the prebuilds explicitly
      # keeps the tarball contents identical to the npm-publish path.
      - name: prebuild bindings (N-API ABIs)
        working-directory: packages/bindings
        shell: pwsh
        run: |
          # `npm run` (not `bun run`) is required: prebuildify shells out to
          # `node-gyp.cmd`, and only npm puts the npm-bundled node-gyp bin on
          # PATH. bun run does not add it -> 'node-gyp.cmd is not recognized'.
          npm run prebuild:all
          if ($LASTEXITCODE -ne 0) { throw "prebuild failed" }
      - name: resolve release tag per package
        id: tags
        shell: pwsh
        run: |
          foreach ($pkg in $env:PKGS.Split(' ')) {
            $tag = git tag --list "$pkg@*" --sort=-version:refname | Select-Object -First 1
            if (-not $tag) { throw "no $pkg@* tag found" }
            "$pkg=$tag" | Out-String | Write-Output
            "$pkg=$tag" >> $env:GITHUB_OUTPUT
          }
      # The version in each package's OWN tag decides the npm channel:
      # 1.2.3-dev.4 -> dev, 1.2.3-next.1 -> next, 1.2.3 (no prerelease) ->
      # latest. Under independent versioning the channel must come from the
      # releasing package's tag, not a shared lockstep version -- so compute
      # it per-package inside the publish loop instead of once from `core`.
      # OIDC Trusted Publishing: no NODE_AUTH_TOKEN -- `id-token: write`
      # lets npm exchange the GitHub OIDC token for a short-lived publish
      # credential. Trusted Publisher on npmjs.com must point at THIS
      # workflow (release-please.yml) for each package.
      # Sequential, dependency-ordered: any failure aborts the rest, so a
      # partial (broken-dependency) release can never ship.
      # `npm publish` uploads `workspace:*` specifiers verbatim and the
      # published package then fails to install (EUNSUPPORTEDPROTOCOL). Bun
      # rewrites them but `bun publish` has no OIDC Trusted-Publisher support
      # yet. Fix: rewrite each package.json's `workspace:*` to the resolved
      # release version of THAT dependency right before `npm publish` (each
      # workspace dep maps to its own @memoryprocess package's release tag --
      # packages version independently under separate-pull-requests).
      - name: rewrite workspace deps to each dep's resolved version
        shell: pwsh
        run: |
          # Independent versioning: rewrite each `workspace:*` dep to the
          # resolved version of THAT dependency (from its own release tag),
          # not a single lockstep version. Build a pkg->version map first.
          $verOf = @{}
          foreach ($pkg in $env:PKGS.Split(' ')) {
            $tag = "${{ steps.tags.outputs.bindings }}","${{ steps.tags.outputs.core }}","${{ steps.tags.outputs.cli }}","${{ steps.tags.outputs.mcp }}" |
              Where-Object { $_ -like "$pkg@*" } | Select-Object -First 1
            $verOf[$pkg] = ($tag -replace '^[^@]+@', '')
          }
          foreach ($pkg in $env:PKGS.Split(' ')) {
            $pj = "packages/$pkg/package.json"
            $o = Get-Content $pj -Raw | ConvertFrom-Json
            $c = Get-Content $pj -Raw
            foreach ($depName in @($o.dependencies.PSObject.Properties.Name)) {
              if ($o.dependencies.$depName -eq 'workspace:*' -and $depName -like '@memoryprocess/*') {
                $depPkg = $depName -replace '^@memoryprocess/', ''
                $depVer = $verOf[$depPkg]
                if (-not $depVer) { throw "no resolved version for dep $depName" }
                $c = $c -replace ('"' + [regex]::Escape($depName) + '"\s*:\s*"workspace:\*"') , ('"' + $depName + '":"^' + $depVer + '"')
                echo "$pkg : $depName workspace:* -> ^$depVer"
              }
            }
            [IO.File]::WriteAllText((Resolve-Path $pj), $c, [Text.UTF8Encoding]::new($false))
          }
      - name: publish to npm (OIDC)
        shell: pwsh
        run: |
          foreach ($pkg in $env:PKGS.Split(' ')) {
            Push-Location "packages/$pkg"
            $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
            # Independent versioning: a package only publishes if its version
            # isn't already on npm -- a release for `bindings` alone must not
            # republish (and E403-abort) the unchanged core/cli/mcp. Check the
            # registry first so an unchanged package is skipped, not failed.
            $published = $false
            try {
              $null = Invoke-RestMethod "https://registry.npmjs.org/@memoryprocess%2f$pkg/$ver" -TimeoutSec 30
              $published = $true
            } catch { $published = $false }
            if ($published) {
              echo "$pkg@$ver already on npm -- skipping"
              Pop-Location
              continue
            }
            $channel = 'latest'
            if ($ver -match '-(dev|next|beta|alpha)') { $channel = $Matches[1] }
            npm publish --access public --tag $channel
            if ($LASTEXITCODE -ne 0) { throw "npm publish failed for $pkg" }
            Pop-Location
            echo "published $pkg@$ver @ $channel"
          }
