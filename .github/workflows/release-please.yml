name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC for npm Trusted Publishing (publish job)

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publishes to npm after release-please cuts the release -- same workflow,
  # no cross-workflow event (GITHUB_TOKEN-created tags/releases never fire
  # other workflows). Versions are LOCKSTEP: the four packages ship one
  # version together, so the publish runs as ONE sequential job in
  # dependency order (bindings -> core -> cli + mcp). A failure aborts
  # before downstream packages publish -- core is never live without its
  # bindings, cli/mcp never without their core.
  # The dist-tag comes from the version suffix in the resolved release tag:
  # -dev/-next/-beta/-alpha -> that channel; stable -> `latest`. `latest`
  # only ever fires on a maintainer-authored `release-as` stable version --
  # docs/releasing.md.
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases == 'true'
    name: publish
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PKGS: bindings core cli mcp # publish order = dependency order
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # resolve release tags
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install
      - name: build all packages
        shell: pwsh
        run: |
          foreach ($pkg in $env:PKGS.Split(' ')) {
            Push-Location "packages/$pkg"
            bun run build
            if ($LASTEXITCODE -ne 0) { throw "build failed for $pkg" }
            Pop-Location
          }
      # bindings also ships per-Node-ABI prebuilds (prebuildify). Run it here
      # in the publish step -- `bun publish` does not pick up node-gyp from the
      # PATH the way npm does, so a `prepublishOnly` script would fail with
      # 'node-gyp.cmd is not recognized'. Building the prebuilds explicitly
      # keeps the tarball contents identical to the npm-publish path.
      - name: prebuild bindings (N-API ABIs)
        working-directory: packages/bindings
        shell: pwsh
        run: |
          # `npm run` (not `bun run`) is required: prebuildify shells out to
          # `node-gyp.cmd`, and only npm puts the npm-bundled node-gyp bin on
          # PATH. bun run does not add it -> 'node-gyp.cmd is not recognized'.
          npm run prebuild:all
          if ($LASTEXITCODE -ne 0) { throw "prebuild failed" }
      - name: resolve release tag per package
        id: tags
        shell: pwsh
        run: |
          foreach ($pkg in $env:PKGS.Split(' ')) {
            $tag = git tag --list "$pkg@*" --sort=-version:refname | Select-Object -First 1
            if (-not $tag) { throw "no $pkg@* tag found" }
            "$pkg=$tag" | Out-String | Write-Output
            "$pkg=$tag" >> $env:GITHUB_OUTPUT
          }
      # The version in the tag decides the npm channel: 1.2.3-dev.4 -> dev,
      # 1.2.3-next.1 -> next, 1.2.3 (no prerelease) -> latest.
      - name: pick dist-tag from version
        id: chan
        shell: pwsh
        run: |
          $ver = '${{ steps.tags.outputs.core }}' -replace '^[^@]+@', ''
          $channel = 'latest'
          if ($ver -match '-(dev|next|beta|alpha)') { $channel = $Matches[1] }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          echo "version=$ver channel=$channel"
      # OIDC Trusted Publishing: no NODE_AUTH_TOKEN -- `id-token: write`
      # lets npm exchange the GitHub OIDC token for a short-lived publish
      # credential. Trusted Publisher on npmjs.com must point at THIS
      # workflow (release-please.yml) for each package.
      # Sequential, dependency-ordered: any failure aborts the rest, so a
      # partial (broken-dependency) release can never ship.
      # `bun publish` (not `npm publish`) is required here: bun rewrites the
      # monorepo `workspace:*` dependency specifiers to the published version
      # (e.g. `@memoryprocess/bindings: workspace:*` -> `^0.0.3-beta.2`).
      # `npm publish` uploads `workspace:*` verbatim and the package then
      # fails to install with EUNSUPPORTEDPROTOCOL.
      - name: publish to npm (OIDC)
        shell: pwsh
        env:
          # actions/setup-node writes a literal `XXXXX-XXXXX` placeholder here
          # that breaks `bun publish` (it reads NODE_AUTH_TOKEN and 404s on the
          # package-GET auth check). Clearing it lets bun use the OIDC
          # Trusted-Publisher flow (`id-token: write` on the job).
          NODE_AUTH_TOKEN: ''
        run: |
          foreach ($pkg in $env:PKGS.Split(' ')) {
            Push-Location "packages/$pkg"
            bun publish --access public --tag ${{ steps.chan.outputs.channel }}
            if ($LASTEXITCODE -ne 0) { throw "bun publish failed for $pkg" }
            Pop-Location
            echo "published $pkg @ ${{ steps.chan.outputs.channel }}"
          }
