name: Publish

# Publishes released packages to npm. Fires on the GitHub *Release* event
# (release-please publishes a release per package tag <pkg>@x.y.z) -- this is
# the canonical trigger for "publish on release", and unlike `on.push.tags` it
# can never fire on a plain branch push. The dist-tag is derived from the
# VERSION in the release tag: prerelease (-dev/-next/-beta/-alpha) -> that
# channel; stable -> `latest`. `latest` only ever fires on a
# maintainer-authored `release-as` stable version -- see docs/releasing.md.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  publish:
    name: publish ${{ matrix.package }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: bindings }
          - { package: core }
          - { package: cli }
          - { package: mcp }
    # Only the package whose release tag fired the run publishes.
    # github.event.release.tag_name is like `bindings@0.0.3-beta.1`.
    if: startsWith(github.event.release.tag_name, format('{0}@', matrix.package))
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install
      - name: build
        working-directory: packages/${{ matrix.package }}
        run: bun run build
      # The version in the tag decides the npm channel: 1.2.3-dev.4 -> dev,
      # 1.2.3-next.1 -> next, 1.2.3 (no prerelease) -> latest.
      - name: pick dist-tag from version
        id: chan
        shell: pwsh
        run: |
          $ver = '${{ github.event.release.tag_name }}' -replace '^[^@]+@', ''
          $channel = 'latest'
          if ($ver -match '-(dev|next|beta|alpha)') { $channel = $Matches[1] }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          echo "version=$ver channel=$channel"
      # OIDC Trusted Publishing: no NODE_AUTH_TOKEN -- the job's `id-token: write`
      # permission lets npm exchange the GitHub OIDC token for a short-lived
      # publish credential. Requires a Trusted Publisher configured on
      # npmjs.com per package pointing at this workflow (publish.yml).
      - name: publish to npm (OIDC)
        working-directory: packages/${{ matrix.package }}
        run: npm publish --access public --tag ${{ steps.chan.outputs.channel }} --provenance
