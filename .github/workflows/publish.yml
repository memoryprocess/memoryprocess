name: Publish

# Publishes released packages to npm on the `dev` channel only.
# `latest` is NEVER set here — stable release is a separate, manually-gated step.
on:
  push:
    tags:
      - 'bindings@*'
      - 'core@*'
      - 'cli@*'
      - 'mcp@*'

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishing

concurrency:
  group: publish-${{ github.ref }}

jobs:
  publish:
    name: publish ${{ matrix.package }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: bindings, tag_match: 'bindings@' }
          - { package: core, tag_match: 'core@' }
          - { package: cli, tag_match: 'cli@' }
          - { package: mcp, tag_match: 'mcp@' }
    # Only publish the package whose tag fired the run.
    if: startsWith(github.ref_name, matrix.tag_match)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install
      - name: build
        working-directory: packages/${{ matrix.package }}
        run: bun run build
      - name: publish to npm (dev channel)
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # or OIDC once Trusted Publishing is configured
        run: npm publish --access public --tag dev
